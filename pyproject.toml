[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "paper-agent"
version = "0.3.0"
description = "自动化论文检索与分析 Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PaperAgent Contributors" }]
dependencies = [
    "faiss-cpu>=1.9,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "numpy>=1.26,<3",
    "openai>=1.68,<3",
    "pymupdf>=1.24,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
paper-agent = "paper_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
